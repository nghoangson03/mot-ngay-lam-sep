<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một Ngày Làm Sếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#17120d; --bg-2:#241b12;
  --panel:#f4ead6; --panel-alt:#e9d9b4;
  --ink:#2b2118; --muted:#7a6a55; --line:#d8c7a6;
  --room-ink:#f3e7cf; --room-muted:#bfae90;
  --gold:#e2b24a; --gold-2:#b8862b;
  --felt:#1e5a3f; --felt-2:#154431;
  --critical:#8c2f2a;
  --stat-money:#b8862b; --stat-rep:#375c8c; --stat-morale:#1e5a3f; --stat-energy:#7a3b52;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --f-ui:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-title:"Playfair Display",Georgia,serif;
  --f-fun:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 60%);color:var(--room-ink);font-family:var(--f-ui);padding-inline:16px;transition:background .6s ease;}
body[data-ind="logistics"]{background:radial-gradient(ellipse at 50% -10%, #1c2b38, #101820 60%);}
body[data-ind="fnb"]{background:radial-gradient(ellipse at 50% -10%, #2e1810, #1f120d 60%);}
body[data-ind="startup"]{background:radial-gradient(ellipse at 50% -10%, #201a34, #131022 60%);}
body[data-ind="factory"]{background:radial-gradient(ellipse at 50% -10%, #2a201c, #171310 60%);}
h1,h2,h3{font-family:var(--f-title);text-wrap:balance;margin:0;}
.mono{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
.wrap{max-width:600px;margin:0 auto;padding-block:16px 28px;}

/* start screen */
.hero-top{text-align:center;margin-bottom:18px;}
.stamp-badge{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;
  border:3px solid var(--gold);color:var(--gold);font-size:30px;transform:rotate(-6deg);margin-bottom:10px;background:#00000022;}
.hero-top h1{font-size:32px;font-weight:700;color:var(--room-ink);}
.hero-top p{color:var(--room-muted);margin-top:10px;font-size:14.5px;line-height:1.6;}
.hero-top strong{color:var(--gold);}

.mode-hint{text-align:center;color:var(--room-muted);font-size:12.5px;margin-top:8px;}

.industry-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
@media (max-width:460px){.industry-grid{grid-template-columns:1fr;}}
.industry-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;color:var(--ink);}
.industry-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.45);}
.industry-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.industry-illust{width:100%;border-radius:6px;overflow:hidden;background:#00000015;margin-bottom:10px;}
.industry-illust svg{display:block;width:100%;height:auto;}
.industry-icon{font-size:20px;display:inline-block;margin-right:6px;}
.industry-name{font-family:var(--f-title);font-weight:700;font-size:17px;margin-bottom:4px;display:flex;align-items:center;}
.industry-teaser{color:var(--muted);font-size:12.5px;line-height:1.45;}

.gallery-box{margin-top:24px;background:#00000030;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--room-ink);}
.gallery-box .label{font-size:12.5px;color:var(--room-muted);}
.gallery-box .count{font-weight:600;font-size:13px;color:var(--gold);}
.ending-dots{display:flex;gap:5px;flex-wrap:wrap;}
.ending-dot{width:10px;height:10px;border-radius:50%;background:var(--line);}
.ending-dot.on{background:var(--gold);}

/* header */
.game-header{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brandline{display:flex;align-items:center;gap:8px;font-family:var(--f-title);font-weight:700;font-size:16px;color:var(--room-ink);}
.brandline .mark{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.week-pill{background:var(--felt);color:var(--room-ink);border:1px solid var(--felt-2);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;font-family:var(--f-fun);cursor:pointer;}
.week-pill:hover{filter:brightness(1.15);}
.month-track{height:7px;border-radius:4px;background:#00000040;overflow:hidden;}
.month-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .5s ease;}
.month-label{display:flex;justify-content:space-between;font-size:12px;color:var(--room-muted);margin-top:4px;}

.ledger-heading{display:none;}
.stat-ledger{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
@media (max-width:440px){.stat-ledger{grid-template-columns:1fr;}}
.stat-row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;align-items:center;gap:8px;position:relative;color:var(--ink);}
.stat-row.span2{grid-column:1/-1;}
.stat-row.critical{border-color:var(--critical);box-shadow:0 0 0 2px rgba(140,47,42,.25);}
.stat-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.stat-body{flex:1;min-width:0;}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:nowrap;}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-label small{opacity:.7;font-weight:500;font-size:10px;}
.stat-value{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;}
.stat-track{height:5px;border-radius:3px;background:var(--panel-alt);margin-top:3px;overflow:hidden;position:relative;}
.stat-fill{height:100%;border-radius:5px;transition:width .5s ease;}
.kpi-tick{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--critical);z-index:2;}
.stat-warn{position:absolute;top:-8px;right:-8px;background:var(--critical);color:#fff;font-size:10px;font-weight:700;
  border-radius:999px;padding:3px 8px;font-family:var(--f-fun);}
.delta-badge{position:absolute;top:-12px;left:10px;font-size:12px;font-weight:700;
  padding:2px 8px;border-radius:999px;animation:floatup .9s ease forwards;font-family:var(--f-fun);}
.delta-badge.pos{background:var(--felt);color:#fff;}
.delta-badge.neg{background:var(--critical);color:#fff;}
@keyframes floatup{from{opacity:0;transform:translateY(4px);}20%{opacity:1;transform:translateY(0);}80%{opacity:1;}to{opacity:0;transform:translateY(-8px);}}

/* event panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px;box-shadow:var(--shadow);color:var(--ink);}
.event-tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-family:var(--f-fun);font-weight:700;}
.event-tag.type-holiday{color:var(--felt);}
.event-tag.type-tet, .event-tag.type-endmonth{color:#a33b2a;}
.panel h2{font-size:22px;margin-bottom:10px;}
.narrative{font-size:14.5px;line-height:1.6;margin-bottom:14px;}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--panel-alt);border:1px solid var(--line);
  border-radius:9px;padding:13px 14px;cursor:pointer;transition:border-color .15s ease, background .15s ease;color:var(--ink);}
.choice-btn:hover{border-color:var(--gold-2);background:#f1dca8;}
.choice-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;}
.choice-btn:disabled{opacity:.55;cursor:default;}
.choice-btn.chosen{opacity:1;border-color:var(--gold-2);background:#f1dca8;box-shadow:0 0 0 2px rgba(184,134,43,.35);}
.choice-letter{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold-2);color:var(--gold-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--f-fun);}
.choice-label{font-size:14px;line-height:1.45;padding-top:3px;}
.choice-label small{display:block;margin-top:4px;font-size:12px;line-height:1.4;}

.result-box{margin-top:14px;padding:14px 16px;background:#f1dca8;border-radius:9px;border:1px solid var(--line);}
.result-box p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink);}
.result-effects{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.eff-chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;font-family:var(--f-fun);}
.eff-chip.pos{background:var(--felt);color:#fff;}
.eff-chip.neg{background:var(--critical);color:#fff;}
.eff-chip.zero{background:var(--line);color:var(--ink);}
.btn-primary{margin-top:14px;width:100%;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#2b2118;border:none;border-radius:9px;
  padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--f-fun);box-shadow:0 4px 12px rgba(0,0,0,.3);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:9px;
  padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:var(--f-fun);}
.btn-rest{margin-top:0;width:100%;border:none;border-radius:9px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--f-fun);color:#fff;background:linear-gradient(180deg,#8a5a72,#5c2c3d);box-shadow:0 4px 12px rgba(0,0,0,.3);}
.btn-rest:hover{filter:brightness(1.08);}

/* ending */
.ending-screen{text-align:center;}
.win-lose-pill{display:inline-block;padding:6px 18px;border-radius:999px;font-family:var(--f-fun);font-weight:700;font-size:14px;letter-spacing:.04em;margin-bottom:14px;}
.win-lose-pill.win{background:var(--felt);color:#fff;}
.win-lose-pill.lose{background:var(--critical);color:#fff;}
.ending-stamp{display:inline-flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:50%;
  border:3px solid var(--critical);color:var(--critical);font-size:40px;transform:rotate(-5deg);margin-bottom:14px;background:#00000022;}
.ending-stamp.good{border-color:var(--gold);color:var(--gold);}
.ending-title{font-size:26px;color:var(--room-ink);}
.ending-desc{color:var(--room-muted);font-size:14.5px;line-height:1.6;margin-top:10px;max-width:480px;margin-inline:auto;}
.ending-stats{margin-top:22px;text-align:left;}
.ending-actions{display:flex;gap:10px;margin-top:22px;}
@media (max-width:420px){.ending-actions{flex-direction:column;}}

.fade-in{animation:fadein .35s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* EP meter */
.ep-meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#00000025;border-radius:8px;padding:9px 13px;margin:10px 0;}
.ep-label{font-size:13px;color:var(--room-muted);font-weight:600;}
.ep-dots{display:flex;gap:5px;}
.ep-dot{width:13px;height:13px;border-radius:50%;background:#00000040;border:1px solid var(--line);}
.ep-dot.filled{background:var(--gold);border-color:var(--gold-2);}
.ep-count{font-size:14px;color:var(--room-ink);font-weight:700;}

/* activity menu */
.section-label{font-size:13.5px;font-weight:700;color:var(--room-ink);margin:10px 0 6px;font-family:var(--f-title);}
.activity-list{display:flex;flex-direction:column;gap:7px;}
.activity-card{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel-alt);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;cursor:pointer;color:var(--ink);width:100%;transition:border-color .15s ease, background .15s ease;}
.activity-card:hover:not(.done):not(.locked){border-color:var(--gold-2);background:#f1dca8;}
.activity-card.done{opacity:.72;background:var(--panel);cursor:default;}
.activity-card.locked{opacity:.45;cursor:not-allowed;}
.activity-icon{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
.activity-body{flex:1;min-width:0;}
.activity-title{font-weight:600;font-size:14px;}
.activity-note{font-size:12px;color:var(--muted);margin-top:3px;}
.activity-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;}
.tag-done{color:var(--felt);font-size:11.5px;font-weight:700;}
.ep-cost{font-size:11px;color:var(--muted);font-weight:700;}
.choice-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.link-back{background:none;border:none;color:var(--gold);font-family:var(--f-fun);font-weight:700;font-size:13px;cursor:pointer;padding:0 0 12px;text-align:left;display:block;}
.daychoice-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.daychoice-actions button{flex:1;min-width:170px;margin-top:0;}

/* fixed activities as square tiles */
.fixed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
@media (max-width:380px){.fixed-grid{grid-template-columns:repeat(2,1fr);}}
.fixed-tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--panel-alt);border:1px solid var(--line);border-radius:9px;padding:6px 4px;cursor:pointer;color:var(--ink);gap:2px;overflow:hidden;}
.fixed-tile:hover:not(.done):not(.locked){border-color:var(--gold-2);background:#f1dca8;}
.fixed-tile.done{opacity:.65;background:var(--panel);cursor:default;}
.fixed-tile.locked{opacity:.45;cursor:not-allowed;}
.fixed-tile .ft-icon{font-size:20px;line-height:1;}
.fixed-tile .ft-title{font-size:9.5px;font-weight:600;line-height:1.2;}
.fixed-tile .ft-chips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.fixed-tile .ft-chips .eff-chip{font-size:8px;padding:0px 4px;}
.fixed-tile .ft-cost{font-size:8px;color:var(--muted);font-weight:700;}
.fixed-tile .ft-done-tag{font-size:8.5px;color:var(--felt);font-weight:700;}
.fixed-tile .ft-note{font-size:8px;color:var(--muted);line-height:1.2;}
.fixed-tile.tile-money{border-color:var(--stat-money);}
.fixed-tile.tile-rep{border-color:var(--stat-rep);}
.fixed-tile.tile-morale{border-color:var(--stat-morale);}
.fixed-tile.tile-energy{border-color:var(--stat-energy);}
.fixed-tile.tile-money .ft-icon{color:var(--stat-money);}
.fixed-tile.tile-rep .ft-icon{color:var(--stat-rep);}
.fixed-tile.tile-morale .ft-icon{color:var(--stat-morale);}
.fixed-tile.tile-energy .ft-icon{color:var(--stat-energy);}

.activity-card{border-left-width:4px;}
.activity-card.acc-big{border-left-color:var(--gold-2);}
.activity-card.acc-holiday{border-left-color:var(--felt);}
.activity-card.acc-tet,.activity-card.acc-endmonth{border-left-color:var(--critical);}
.activity-card.acc-random{border-left-color:var(--stat-rep);}

/* popups */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,8,5,.62);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;max-width:460px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);color:var(--ink);animation:modalpop .22s ease both;}
.modal-eyebrow{font-family:var(--f-fun);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
@keyframes modalpop{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
(function(){
  var MONEY_MULT = 5;
  var STAT_META = {

  };

  var ILLUST = {

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
    return a;
  }

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function fmtDate(d){ return WEEKDAY_VN[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1); }

  function getTargetMonth(){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth()+1;
    m += 1; if(m>12){ m=1; y+=1; }
    return {year:y, month:m};
  }
  function buildWorkDays(year, month){
    var days = []; var d = new Date(year, month-1, 1);
    while(d.getMonth()===month-1){
      var wd = d.getDay();
      if(wd>=1 && wd<=5) days.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    return days;
  }
  function findHolidayIndex(workDays, month){
    var fixed = [[1,1],[4,30],[5,1],[9,2]];
    for(var i=0;i<workDays.length;i++){
      var d = workDays[i];
      for(var j=0;j<fixed.length;j++){
        if(d.getMonth()+1===fixed[j][0] && d.getDate()===fixed[j][1]) return i;
      }
    }
    return Math.floor(workDays.length*0.45);
  }

  function buildSchedule(key){
    var industry = INDUSTRIES[key];
    var tm = getTargetMonth();
    var workDays = buildWorkDays(tm.year, tm.month);
    var N = workDays.length;
    var holidayIdx = findHolidayIndex(workDays, tm.month);
    var lastIdx = N-1;
    var exclude = {}; exclude[holidayIdx]=1; exclude[lastIdx]=1;
    var avail = [];
    for(var i=0;i<N;i++){ if(!exclude[i]) avail.push(i); }
    var bigCount = Math.min(10, avail.length);
    var bigPositions = {};
    for(var k=0;k<bigCount;k++){
      var idx = Math.floor((k+0.5)*avail.length/bigCount);
      bigPositions[avail[idx]] = k;
    }
    var pool = shuffle(RANDOM_POOL); var poolIdx = 0;
    function drawRandom(){ if(poolIdx>=pool.length){ pool=shuffle(RANDOM_POOL); poolIdx=0; } return pool[poolIdx++]; }
    function toEv(type, src){ return {type:type, title:src.title, text:src.text, opts:src.opts}; }
    var isTetMonth = (tm.month===1 || tm.month===2);
    var schedule = [];
    for(var d=0; d<N; d++){
      var dayEvs = [];
      if(bigPositions.hasOwnProperty(d)){
        dayEvs.push(toEv('big', industry.events[bigPositions[d]]));
        if(Math.random()<0.35){ dayEvs.push(toEv('random', drawRandom())); }
      } else if(d===holidayIdx){
        dayEvs.push(toEv('holiday', HOLIDAY_EVENT));
      } else if(d===lastIdx){
        dayEvs.push(toEv(isTetMonth?'tet':'endmonth', isTetMonth?TET_EVENT:ENDMONTH_EVENT));
      } else {
        var roll = Math.random(); var count = roll<0.5?1:(roll<0.85?2:3);
        for(var c=0;c<count;c++){ dayEvs.push(toEv('random', drawRandom())); }
      }
      schedule.push(dayEvs);
    }
    return {workDays:workDays, days:schedule, monthLabel: MONTH_NAMES_VN[tm.month-1]+' '+tm.year};
  }

  var FIN_SALARY_PER_HEAD = 0.3, FIN_OVERHEAD = 1;
  function severityMult(dayIdx){
    if(dayIdx<4) return 0.5;
    if(dayIdx<8) return 0.75;
    return 1;
  }
  function computeDailyFinance(headcount, morale){
    var revenue = 1 * headcount * (morale/100);
    var cost = headcount*FIN_SALARY_PER_HEAD + FIN_OVERHEAD;
    var profit = revenue - cost;
    return {revenue:revenue, cost:cost, profit:profit, internalDelta:profit/MONEY_MULT};
  }

  function checkInstantFail(){
    var s = state.stats; var floor = MODES[state.mode].failFloor;
    if(s.money<=floor) return 'lose_bankrupt';
    return null;
  }

  function evaluateMonthEnd(){
    var s = state.stats; var kpi = MODES[state.mode].kpi;
    var moraleOK = s.morale>=50, kpiOK = s.money>=kpi;
    if(moraleOK && kpiOK){
      if(s.morale>=80 && s.money>=95 && s.rep>=70 && s.energy>=50) return 'win_legend';
      return 'win_normal';
    }
    if(!moraleOK && !kpiOK) return 'lose_both';
    if(!kpiOK) return 'lose_kpi';
    return 'lose_morale';
  }

  function goEnding(key){
    state.endingKey = key; state.screen = 'ending';
    saveUnlocked(key);
    snapshot(); render();
  }

  function addDayTotal(deltaArr){
    STAT_ORDER.forEach(function(k,idx){ state.dayTotals[k] += (deltaArr[idx]||0); });
  }

  function beginNewDay(){
    state.epToday = state.epMax;
    state.fixedDone = {};
    state.dayTotals = {money:0,rep:0,morale:0,energy:0};
    var morale = state.stats.morale;
    var risk = state.headcount>1 ? (morale<10?0.9 : morale<25?0.6 : morale<40?0.35 : 0)*severityMult(state.dayCursor) : 0;
    if(Math.random()<risk){
      var pick = ATTRITION_EVENTS[Math.floor(Math.random()*ATTRITION_EVENTS.length)];
      state.scheduleData.days[state.dayCursor].unshift({type:'attrition', title:pick.title, text:pick.text, opts:pick.opts});
    }
    var dayEvs = state.scheduleData.days[state.dayCursor];
    state.emergentDone = dayEvs.map(function(){ return false; });
    state.activeEmergent = null;
  }

  function startIndustry(key){
    var mode = MODES[state.selectedMode||'extreme'];
    var industry = INDUSTRIES[key];
    state.industryKey = key;
    state.mode = state.selectedMode||'extreme';
    state.scheduleData = buildSchedule(key);
    state.dayCursor = 0;
    state.epMax = EP_BY_MODE[state.mode];
    state.headcount = Math.max(1, Math.round(industry.base*0.6));
    state.stats = {money:mode.start.money, rep:mode.start.rep, morale:mode.start.morale, energy:mode.start.energy};
    state.dayEndModal = null; state.actionResultModal = null; state.pendingFail = null; state.endingKey = null;
    beginNewDay();
    state.screen = 'dayhub';
    snapshot(); render();
  }

  function replaySame(){ state.selectedMode = state.mode; startIndustry(state.industryKey); }
  function backToStart(){ state = defaultState(); snapshot(); render(); }

  function fxChips(fx){
    return STAT_ORDER.map(function(k,idx){
      var v = fx[idx]; if(!v) return '';
      var display = k==='money' ? Math.round(v*MONEY_MULT) : v;
      if(!display) return '';
      var cls = v>0?'pos':'neg'; var sign = v>0?'+':'';
      return '<span class="eff-chip '+cls+'">'+STAT_META[k].icon+' '+sign+display+'</span>';
    }).join('');
  }
  function previewChips(fx){
    var s = state.stats;
    return STAT_ORDER.map(function(k,idx){
      var raw = fx[idx]; if(!raw) return '';
      var before = s[k]; var v = clamp(before+raw)-before; if(!v) return '';
      var display = k==='money' ? Math.round(v*MONEY_MULT) : v;
      if(!display) return '';
      var cls = v>0?'pos':'neg'; var sign = v>0?'+':'';
      return '<span class="eff-chip '+cls+'">'+STAT_META[k].icon+' '+sign+display+'</span>';
    }).join('');
  }
  function typeLabelOf(t){ return t==='big' ? 'Sự kiện quan trọng' : t==='holiday' ? 'Ngày Lễ' : t==='tet' ? 'Cận Tết' : t==='endmonth' ? 'Tổng kết cuối tháng' : t==='attrition' ? 'Nhân sự biến động' : 'Việc phát sinh nhỏ'; }
  function typeIcon(t){ return t==='big'?'⚡':t==='holiday'?'🎉':t==='tet'?'🧧':t==='endmonth'?'📊':t==='attrition'?'🚪':'📌'; }
  function isMinorType(t){ return t==='random'; }

  function doFixedActivity(key){
    var act = FIXED_ACTIVITIES.filter(function(a){ return a.key===key; })[0];
    var industry = INDUSTRIES[state.industryKey];
    if(state.epToday<act.ep || state.fixedDone[key]) return;
    if(act.hire<0 && state.headcount<=1) return;
    var s = state.stats; var deltaArr = [];
    var fx = act.fx.slice();
    var outText = act.out;
    var hireSuccess = null;
    if(key==='earn'){
      fx[0] = Math.round(4 + (s.energy/100)*10);
      outText = s.energy>=60 ? 'Sức khỏe tốt giúp bạn đàm phán tự tin, chốt được một hợp đồng khá ổn.' : (s.energy>=30 ? 'Bạn chốt thêm được một khoản doanh thu nhỏ cho công ty.' : 'Quá mệt mỏi khiến buổi đàm phán hời hợt, chỉ mang về một khoản rất nhỏ.');
    }
    if(key==='hire'){
      hireSuccess = Math.random()*100 < s.rep;
    }
    STAT_ORDER.forEach(function(k,idx){ var before=s[k]; var after=clamp(before+fx[idx]); deltaArr.push(after-before); s[k]=after; });
    addDayTotal(deltaArr);
    if(act.hire){
      if(key==='hire'){
        if(hireSuccess){ state.headcount = state.headcount+1; outText = 'Ứng viên đồng ý gia nhập! Một nhân sự mới chính thức về đội.'; }
        else { outText = 'Rất tiếc, ứng viên từ chối lời mời lần này. Công sức tuyển dụng chưa có kết quả.'; }
      } else {
        state.headcount = Math.max(1, state.headcount + act.hire);
      }
    }
    state.fixedDone[key] = {out:outText};
    state.epToday -= act.ep;
    state.pendingFail = checkInstantFail();
    state.actionResultModal = {icon:act.icon, title:act.title, text:outText, deltaArr:deltaArr, kind:'fixed'};
    snapshot(); render();
  }

  function openEmergent(idx){
    if(state.epToday<=0 || state.emergentDone[idx]) return;
    state.activeEmergent = idx;
    render();
  }
  function closeEmergent(){ state.activeEmergent = null; render(); }

  function chooseEmergentOption(letter, opt){
    if(state.emergentDone[state.activeEmergent]) return;
    var ev = state.scheduleData.days[state.dayCursor][state.activeEmergent];
    var industry = INDUSTRIES[state.industryKey];
    var mult = severityMult(state.dayCursor);
    var s = state.stats; var deltaArr = [];
    STAT_ORDER.forEach(function(k,idx){ var raw=opt.fx[idx]; var scaled = raw<0?Math.round(raw*mult):raw; var before=s[k]; var after=clamp(before+scaled); deltaArr.push(after-before); s[k]=after; });
    addDayTotal(deltaArr);
    if(opt.hc){ state.headcount = Math.max(1, state.headcount + opt.hc); }
    state.emergentDone[state.activeEmergent] = true;
    state.epToday--;
    state.pendingFail = checkInstantFail();
    state.actionResultModal = {icon:typeIcon(ev.type), title:ev.title, text:opt.out, deltaArr:deltaArr, kind:'emergent'};
    snapshot(); render();
  }

  function dismissActionResult(){
    var kind = state.actionResultModal ? state.actionResultModal.kind : null;
    state.actionResultModal = null;
    if(kind==='emergent'){ state.activeEmergent = null; }
    if(state.pendingFail){ var f = state.pendingFail; state.pendingFail = null; goEnding(f); return; }
    snapshot(); render();
  }

  function finishDayAndAdvance(rested, hadPenalty){
    var industry = INDUSTRIES[state.industryKey];
    var hc = state.headcount;
    var fin = computeDailyFinance(hc, state.stats.morale);
    var before = state.stats.money;
    state.stats.money = clamp(state.stats.money + fin.internalDelta);
    var actualDrift = state.stats.money - before;
    state.dayTotals.money += actualDrift;
    var totalsArr = STAT_ORDER.map(function(k){ return state.dayTotals[k]; });
    var recap = {headcount:hc, drift:actualDrift, revenue:Math.round(fin.revenue), cost:Math.round(fin.cost), rested:rested, penalty:hadPenalty, totals:totalsArr};
    var fail = checkInstantFail();
    if(fail){ goEnding(fail); return; }
    state.dayEndModal = {
      dateLabel: fmtDate(state.scheduleData.workDays[state.dayCursor]),
      recap: recap,
      isLastDay: (state.dayCursor+1 >= state.scheduleData.days.length)
    };
    snapshot(); render();
  }

  function dismissDayEndModal(){
    state.dayEndModal = null;
    state.dayCursor++;
    if(state.dayCursor >= state.scheduleData.days.length){ goEnding(evaluateMonthEnd()); return; }
    beginNewDay();
    state.screen = 'dayhub';
    snapshot(); render();
  }

  function endDay(restedAll){
    var dayEvs = state.scheduleData.days[state.dayCursor];
    var penalized = false;
    var mult = severityMult(state.dayCursor);
    dayEvs.forEach(function(ev, idx){
      if(!state.emergentDone[idx]){
        var repBefore = state.stats.rep, moraleBefore = state.stats.morale;
        if(isMinorType(ev.type)){
          state.stats.rep = clamp(state.stats.rep - Math.round(3*mult));
          state.stats.morale = clamp(state.stats.morale - Math.round(2*mult));
        } else {
          state.stats.rep = clamp(state.stats.rep - Math.round(9*mult));
          state.stats.morale = clamp(state.stats.morale - Math.round(6*mult));
        }
        state.dayTotals.rep += state.stats.rep - repBefore;
        state.dayTotals.morale += state.stats.morale - moraleBefore;
        penalized = true;
      }
    });
    if(restedAll){
      var before = state.stats.energy;
      state.stats.energy = clamp(state.stats.energy + 15);
      state.dayTotals.energy += state.stats.energy - before;
    }
    finishDayAndAdvance(restedAll, penalized);
  }

  }

    return '<div class="stat-row'+(critical?' critical':'')+'">'+
      (critical?'<span class="stat-warn">Nguy hiểm</span>':'')+
      deltaHtml+
      '<span class="stat-icon">'+meta.icon+'</span>'+
      '<div class="stat-body">'+
        '<div class="stat-top"><span class="stat-label">'+meta.label+suffix+'</span><span class="stat-value mono">'+displayVal+'</span></div>'+
        '<div class="stat-track">'+tick+'<div class="stat-fill" style="width:'+value+'%;background:'+meta.color+'"></div></div>'+

  function render(){

      '💰 <strong>Chi phí</strong> (lương + vận hành): -'+r.cost+' triệu<br>'+
      '💰 <strong>Lợi nhuận hôm nay:</strong> <span class="eff-chip '+pcls+'">'+psign+(r.revenue-r.cost)+' triệu</span></p></div>'+
      (totalsChips ? '<div class="result-box"><p><strong>Tổng hợp cả ngày:</strong></p><div class="result-effects">'+totalsChips+'</div></p></div>' : '')+
      penaltyNote+
      '<button class="btn-primary" id="btn-dismiss-dayend">'+(m.isLastDay?'Xem kết quả tháng':'Sang ngày mới →')+'</button>'+
    '</div></div>';
  }

  function renderEnding(){
    var industry = INDUSTRIES[state.industryKey];
    var ending = ENDINGS[state.endingKey];
    var stampClass = ending.stamp==='good' ? 'good' : '';
    var s = state.stats;
    var statsHtml = STAT_ORDER.map(function(k){ return statRowHtml(k, s[k], null); }).join('') + headcountRowHtml();
    return '<div class="ending-screen fade-in">'+
      '<div class="win-lose-pill '+ending.wl+'">'+(ending.wl==='win'?'✅ THẮNG':'❌ THUA')+'</div>'+
      '<div><span class="ending-stamp '+stampClass+'">'+ending.emoji+'</span></div>'+
      '<h2 class="ending-title">'+escapeHtml(ending.title)+'</h2>'+
      '<p class="ending-desc">'+escapeHtml(ending.desc(industry))+'</p>'+
      '<div class="ending-stats"><h3 class="ledger-heading">📋 Chỉ số cuối tháng</h3><div class="stat-ledger">'+statsHtml+'</div></div>'+
      '<div class="ending-actions">'+
        '<button class="btn-primary" id="btn-replay">Chơi lại ngành này</button>'+
        '<button class="btn-secondary" id="btn-back">Chọn ngành khác</button>'+
      '</div>'+
    '</div>';
  }

  function bindEvents(){
    var app = document.getElementById('app');
    var rulesBtn = document.getElementById('btn-rules');
    if(rulesBtn) rulesBtn.addEventListener('click', function(){ state.showRules = true; render(); });
    var closeRulesBtn = document.getElementById('btn-close-rules');
    if(closeRulesBtn) closeRulesBtn.addEventListener('click', function(){ state.showRules = false; render(); });
    var industryCards = app.querySelectorAll('[data-industry]');
    industryCards.forEach(function(card){ card.addEventListener('click', function(){ startIndustry(card.getAttribute('data-industry')); }); });
    var fixedBtns = app.querySelectorAll('[data-fixed]');
    fixedBtns.forEach(function(btn){ btn.addEventListener('click', function(){ doFixedActivity(btn.getAttribute('data-fixed')); }); });
    var emergentBtns = app.querySelectorAll('[data-emergent]');
    emergentBtns.forEach(function(btn){ btn.addEventListener('click', function(){ openEmergent(parseInt(btn.getAttribute('data-emergent'),10)); }); });
    var restAllBtn = document.getElementById('btn-rest-all');
    if(restAllBtn) restAllBtn.addEventListener('click', function(){ endDay(true); });
    var endDayBtn = document.getElementById('btn-end-day');
    if(endDayBtn) endDayBtn.addEventListener('click', function(){ endDay(false); });
    var cancelBtn = document.getElementById('btn-cancel-emergent');
    if(cancelBtn) cancelBtn.addEventListener('click', closeEmergent);
    var backMenuBtn = document.getElementById('btn-back-to-menu');
    if(backMenuBtn) backMenuBtn.addEventListener('click', closeEmergent);
    var choiceBtns = app.querySelectorAll('.choice-btn[data-letter]');
    choiceBtns.forEach(function(btn){
      btn.addEventListener('click', function(){
        if(state.emergentDone[state.activeEmergent]) return;
        var dayEvs = state.scheduleData.days[state.dayCursor];
        var ev = dayEvs[state.activeEmergent];
        var letter = btn.getAttribute('data-letter');
        var opt = ev.opts.filter(function(o){ return o.l===letter; })[0];
        chooseEmergentOption(letter, opt);
      });
    });
    var dismissResultBtn = document.getElementById('btn-dismiss-result');
    if(dismissResultBtn) dismissResultBtn.addEventListener('click', dismissActionResult);
    var dismissDayEndBtn = document.getElementById('btn-dismiss-dayend');
    if(dismissDayEndBtn) dismissDayEndBtn.addEventListener('click', dismissDayEndModal);
    var replayBtn = document.getElementById('btn-replay');
    if(replayBtn) replayBtn.addEventListener('click', replaySame);
    var backBtn = document.getElementById('btn-back');
    if(backBtn) backBtn.addEventListener('click', backToStart);
  }

  function boot(initial){
    state = Object.assign(defaultState(), initial||{});
    render();
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); }
  else { boot(window.claude && window.claude.hot && window.claude.hot.data); }
})();
</script>
</body>
</html>
